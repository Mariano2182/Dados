<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dados</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111;
      color: #fff;
    }

    .container {
      margin-top: 40px;
    }

    img {
      width: 500px;
      height: 500px;
      object-fit: cover;
      border: 2px solid white;
      border-radius: 10px;
    }

    .text-dice {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
    }

    button {
      margin-top: 30px;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #ff0055;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #cc0044;
    }

    /* Animación suave */
    img, .text-dice {
      transition: transform 0.3s ease;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🎲 Dados</h1>

    <img id="imageDice" src="Screenshot_20260503-204624.png">
    <div class="text-dice" id="textDice">Presioná tirar</div>

    <button onclick="tirarDados()">Tirar</button>
  </div>

  <!-- AUDIO -->
  <audio id="sonido" src="sonido.mp3"></audio>

  <script>
    const imagenes = [
      "Screenshot_20260503-204624.png",
      "Screenshot_20260503-204645.png",
      "Screenshot_20260503-204701.png",
      "Screenshot_20260503-204729.png",
      "Screenshot_20260503-204743.png",
      "Screenshot_20260503-204757.png",
      "Screenshot_20260503-204819.png",
      "Screenshot_20260503-204843.png",
      "Screenshot_20260503-204911.png",
      "Screenshot_20260503-204941.png",
      "Screenshot_20260503-205131.png",
      "Screenshot_20260503-205122.png",
      "Screenshot_20260503-205113.png",
      "Screenshot_20260503-205056.png",
      "Screenshot_20260503-204950.png"
    ];

    const textos = [
      "1 metida",
      "2 metidas",
      "fuertazo",
      "rápido hasta terminar",
      "lento hasta terminar",
      "2 minutos",
      "5 minutos",
      "despacito"
    ];

    let tirando = false;

    function tirarDados() {
  if (tirando) return;
  tirando = true;

  const img = document.getElementById("imageDice");
  const text = document.getElementById("textDice");

  let vueltas = 0;

  const intervalo = setInterval(() => {
    const randomImg = Math.floor(Math.random() * imagenes.length);
    const randomText = Math.floor(Math.random() * textos.length);

    img.src = imagenes[randomImg];
    text.innerText = textos[randomText];

    vueltas++;

    if (vueltas >= 15) {
      clearInterval(intervalo);
      resultadoFinal();
    }
  }, 100);
    }

    function resultadoFinal() {
      const finalImg = Math.floor(Math.random() * imagenes.length);
      const finalText = Math.floor(Math.random() * textos.length);

      const img = document.getElementById("imageDice");
      const text = document.getElementById("textDice");

      img.src = imagenes[finalImg];
      text.innerText = textos[finalText];

      // 📳 vibración
      if (navigator.vibrate) {
        navigator.vibrate([100, 50, 200]);
      }

      // 💥 zoom
      img.style.transform = "scale(1.3)";
      text.style.transform = "scale(1.3)";

      setTimeout(() => {
        img.style.transform = "scale(1)";
        text.style.transform = "scale(1)";
        tirando = false;
      }, 300);
    }
  </script>

</body>
</html>
