<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dados</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #000;
  color: #fff;
}

/* 🔥 NEON */
#neon {
  font-size: 60px;
  color: #ff0055;
  margin-top: 40%;
  text-shadow:
    0 0 10px #ff0055,
    0 0 20px #ff0055,
    0 0 40px #ff0055,
    0 0 80px #ff0055;
  animation: parpadeo 1.5s infinite alternate;
}

@keyframes parpadeo {
  from { opacity: 1; }
  to { opacity: 0.6; }
}

.container {
  display: none;
  margin-top: 30px;
}

img {
  width: 90%;
  max-width: 400px;
  border-radius: 10px;
  display: none;
}

button {
  margin: 10px;
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  background: #ff0055;
  color: white;
}

button:disabled {
  background: #444;
}

.girando {
  animation: girar 0.1s linear infinite;
}

@keyframes girar {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<!-- 🔥 PANTALLA NEON -->
<div id="neon">DADOS RICOS</div>

<!-- 🎮 JUEGO -->
<div class="container" id="game">

  <h2 id="estado">Elegí nivel</h2>

  <img id="imageDice" src="Screenshot_20260503-204624.png">

  <div id="timer"></div>
  <div id="textDice"></div>

  <!-- NIVELES -->
  <div id="niveles">
    <button onclick="setNivel('Suave')">Suave</button>
    <button onclick="setNivel('Medio')">Medio</button>
    <button onclick="setNivel('Intenso')">Intenso</button>
  </div>

  <button id="btnClima" onclick="tirarClima()" disabled>Entrar en clima</button>
  <button id="btnAccion" onclick="tirarAccion()" disabled>Ir a la acción</button>

</div>
const climaBase = [
  "Besos",
  "Caricias",
  "Mirarse",
  "Abrazarse",
  "Respirar juntos",
  "Recorrer el cuerpo lentamente"
];

const restricciones = [
  "sin hablar",
  "con ojos cerrados",
  "muy lento",
  "sin manos",
  "en silencio total",
  "mirándose fijo"
];
<script>
const imagenes = [
  "Screenshot_20260503-204624.png",
  "Screenshot_20260503-204645.png",
  "Screenshot_20260503-204701.png",
  "Screenshot_20260503-204729.png",
  "Screenshot_20260503-204743.png",
  "Screenshot_20260503-204757.png",
  "Screenshot_20260503-204819.png",
  "Screenshot_20260503-204843.png",
  "Screenshot_20260503-204911.png",
  "Screenshot_20260503-204941.png",
  "Screenshot_20260503-205131.png",
  "Screenshot_20260503-205122.png",
  "Screenshot_20260503-205113.png",
  "Screenshot_20260503-205056.png",
  "Screenshot_20260503-204950.png"
];

const textos = [
  "1 metida",
  "2 metidas",
  "fuertazo",
  "rápido",
  "lento",
  "2 min",
  "5 min",
  "despacito"
];

let climaListo = false;
let timerActivo = null;

/* 🎚 NIVEL */
function setNivel(nivel) {
  document.getElementById("neon").style.display = "none";
  document.getElementById("game").style.display = "block";

  document.getElementById("estado").innerText = "Nivel: " + nivel;

  document.getElementById("btnClima").disabled = false;
}

/* 💕 CLIMA */
function tirarClima() {
  const accion = climaBase[Math.floor(Math.random() * climaBase.length)];
  const restriccion = restricciones[Math.floor(Math.random() * restricciones.length)];

  const combinacion = accion + " (" + restriccion + ")";

  document.getElementById("estado").innerText = combinacion;

  let segundos = 10;

  timerActivo = setInterval(() => {
    document.getElementById("timer").innerText = "⏱ " + segundos;

    segundos--;

    if (segundos < 0) {
      clearInterval(timerActivo);
      document.getElementById("estado").innerText = "🔥 Listo para acción";
      document.getElementById("btnAccion").disabled = false;
    }
  }, 1000);
}

/* 🎲 ACCION */
function tirarAccion() {
  const img = document.getElementById("imageDice");
  const text = document.getElementById("textDice");

  img.style.display = "block";
  img.classList.add("girando");

  let vueltas = 0;

  const intervalo = setInterval(() => {
    const randomImg = Math.floor(Math.random() * imagenes.length);
    const randomText = Math.floor(Math.random() * textos.length);

    img.src = imagenes[randomImg];
    text.innerText = textos[randomText];

    vueltas++;

    if (vueltas >= 15) {
      clearInterval(intervalo);
      img.classList.remove("girando");
    }
  }, 100);
}
</script>

</body>
</html>
