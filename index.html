<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Dados Ricos</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff0066">

<!-- ICONO -->
<link rel="icon" href="icon-192.png">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:black;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* ========================= */
/* PORTADA */
/* ========================= */

#pantallaInicio{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:1000;
}

#tituloNeon{
  font-size:16vw;
  color:#ff0066;
  text-shadow:
    0 0 5px #ff0066,
    0 0 15px #ff0066,
    0 0 30px #ff0066,
    0 0 60px #ff0066;
  animation: neon 1s infinite alternate;
  cursor:pointer;
  text-align:center;
}

@keyframes neon{
  from{
    opacity:0.8;
    transform:scale(1);
  }

  to{
    opacity:1;
    transform:scale(1.05);
  }
}

/* ========================= */
/* APP */
/* ========================= */

#app{
  display:none;
  min-height:100vh;
  padding:20px;
}

.container{
  max-width:500px;
  margin:auto;
  text-align:center;
}

h1{
  margin-top:10px;
  margin-bottom:20px;
  color:#ff0066;
}

/* ========================= */
/* VISOR */
/* ========================= */

#visor{
  width:100%;
  height:60vh;
  border-radius:20px;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  margin-bottom:20px;
  border:2px solid #ff0066;
  box-shadow:0 0 20px #ff006655;
}

#imageDice{
  width:100%;
  height:100%;
  object-fit:contain;
  display:none;
}

/* ========================= */
/* TEXTO */
/* ========================= */

#climaTexto{
  font-size:28px;
  color:#00ffaa;
  margin-bottom:15px;
  min-height:80px;
}

#accionTexto{
  font-size:30px;
  color:#ffcc00;
  margin-bottom:15px;
  min-height:50px;
}

#timer{
  font-size:26px;
  margin-bottom:20px;
}

/* ========================= */
/* BOTONES */
/* ========================= */

button{
  padding:14px 22px;
  margin:8px;
  border:none;
  border-radius:14px;
  background:#ff0066;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
}

button:disabled{
  opacity:0.4;
}

/* ========================= */
/* GIRO */
/* ========================= */

.girando{
  animation:girar 0.12s linear infinite;
}

@keyframes girar{
  from{
    transform:rotate(0deg) scale(1);
  }

  to{
    transform:rotate(360deg) scale(1.05);
  }
}

/* ========================= */
/* REBOTE */
/* ========================= */

.rebote{
  animation:rebote 0.5s;
}

@keyframes rebote{

  0%{
    transform:scale(0.8);
  }

  50%{
    transform:scale(1.1);
  }

  100%{
    transform:scale(1);
  }
}

</style>
</head>

<body>

<!-- ========================= -->
<!-- PORTADA -->
<!-- ========================= -->

<div id="pantallaInicio">
  <div id="tituloNeon" onclick="abrirJuego()">
    DADOS RICOS
  </div>
</div>

<!-- ========================= -->
<!-- APP -->
<!-- ========================= -->

<div id="app">

  <div class="container">

    <h1>🎲 Dados Ricos</h1>

    <!-- VISOR -->
    <div id="visor">

      <img
        id="imageDice"
        src="img1.png"
      >

      <div id="climaTexto">
        Elegí un nivel
      </div>

    </div>

    <!-- ACCIÓN -->
    <div id="accionTexto"></div>

    <!-- TIMER -->
    <div id="timer"></div>

    <!-- NIVELES -->
    <div id="niveles">

      <button onclick="setNivel('Suave')">
        Suave
      </button>

      <button onclick="setNivel('Medio')">
        Medio
      </button>

      <button onclick="setNivel('Intenso')">
        Intenso
      </button>

    </div>

    <!-- BOTONES -->
    <div>

      <button
        id="btnClima"
        onclick="tirarClima()"
        disabled
      >
        Entrar en clima
      </button>

      <button
        id="btnAccion"
        onclick="tirarAccion()"
        disabled
      >
        Ir a la acción
      </button>

      <button onclick="resetJuego()">
        Nueva ronda
      </button>

    </div>

  </div>

</div>

<!-- AUDIO -->
<audio id="sonido" src="sonido.mp3"></audio>

<script>

/* ========================= */
/* ABRIR JUEGO */
/* ========================= */

function abrirJuego(){

  document.getElementById("pantallaInicio").style.display="none";

  document.getElementById("app").style.display="block";
}

/* ========================= */
/* IMÁGENES */
/* ========================= */

const imagenes = [

"img1.png",
"img2.png",
"img3.png",
"img4.png",
"img5.png",
"img6.png"
];

/* ========================= */
/* ACCIONES */
/* ========================= */

const textos = [

"1 minuto",
"2 minutos",
"rápido",
"despacito",
"intenso",
"lento",
"profundo",
"sin parar"

];

/* ========================= */
/* CLIMA */
/* ========================= */

const climaBase = [

"Besos",
"Caricias",
"Mirarse",
"Abrazarse",
"Respirar juntos",
"Explorar lentamente"

];

const restricciones = [

"sin hablar",
"con ojos cerrados",
"muy lento",
"sin manos",
"en silencio total",
"mirándose fijo"

];

let nivel = null;
let climaListo = false;
let timerActivo = null;

/* ========================= */
/* NIVEL */
/* ========================= */

function setNivel(n){

  nivel = n;

  document.getElementById("climaTexto").innerHTML =
    "Nivel seleccionado:<br><br>" + n;

  document.getElementById("btnClima").disabled = false;
}

/* ========================= */
/* CLIMA */
/* ========================= */

function tirarClima(){

  const accion =
    climaBase[
      Math.floor(Math.random()*climaBase.length)
    ];

  const restriccion =
    restricciones[
      Math.floor(Math.random()*restricciones.length)
    ];

  const tiempo =
    Math.floor(Math.random()*2)+1;

  document.getElementById("climaTexto").innerHTML =
    accion + "<br><br>(" + restriccion + ")";

  iniciarTimer(tiempo*60);

  document.getElementById("btnClima").disabled = true;
}

/* ========================= */
/* TIMER */
/* ========================= */

function iniciarTimer(segundos){

  clearInterval(timerActivo);

  timerActivo = setInterval(()=>{

    let min =
      Math.floor(segundos/60);

    let sec =
      segundos%60;

    document.getElementById("timer").innerText =
      "⏱ " +
      min +
      ":" +
      (sec<10?"0":"") +
      sec;

    segundos--;

    if(segundos<0){

      clearInterval(timerActivo);

      document.getElementById("timer").innerText =
        "🔥 Pasar a la acción";

      climaListo = true;

      document.getElementById("btnAccion").disabled = false;
    }

  },1000);
}

/* ========================= */
/* ACCIÓN */
/* ========================= */

function tirarAccion(){

  if(!climaListo) return;

  const img =
    document.getElementById("imageDice");

  const accion =
    document.getElementById("accionTexto");

  const clima =
    document.getElementById("climaTexto");

  clima.style.display="none";

  img.style.display="block";

  img.classList.add("girando");

  let vueltas = 0;

  const sonido =
    document.getElementById("sonido");

  sonido.currentTime = 0;
  sonido.play().catch(()=>{});

  const intervalo = setInterval(()=>{

    const randomImg =
      Math.floor(Math.random()*imagenes.length);

    const randomText =
      Math.floor(Math.random()*textos.length);

    img.src = imagenes[randomImg];

    accion.innerText = textos[randomText];

    vueltas++;

    if(vueltas>=20){

      clearInterval(intervalo);

      img.classList.remove("girando");

      img.classList.add("rebote");

      if(navigator.vibrate){

        navigator.vibrate([100,50,200]);
      }

      setTimeout(()=>{

        img.classList.remove("rebote");

      },500);
    }

  },90);
}

/* ========================= */
/* RESET */
/* ========================= */

function resetJuego(){

  nivel = null;

  climaListo = false;

  clearInterval(timerActivo);

  document.getElementById("climaTexto").style.display =
    "block";

  document.getElementById("climaTexto").innerHTML =
    "Elegí un nivel";

  document.getElementById("accionTexto").innerHTML =
    "";

  document.getElementById("timer").innerHTML =
    "";

  document.getElementById("imageDice").style.display =
    "none";

  document.getElementById("btnClima").disabled =
    true;

  document.getElementById("btnAccion").disabled =
    true;
}

/* ========================= */
/* SERVICE WORKER */
/* ========================= */

if("serviceWorker" in navigator){

  navigator.serviceWorker.register("sw.js");
}

</script>

</body>
</html>
